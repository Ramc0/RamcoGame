<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Juego Isométrico v2.2</title>
<style>
body{margin:0;background:#111;overflow:hidden}
canvas{display:block;margin:auto;background:#eee}
</style>
</head>
<body>
<canvas id="lienzo" width="1024" height="768"></canvas>

<script>
const lienzo = document.getElementById("lienzo");
const contexto = lienzo.getContext("2d");

const ANCHO = lienzo.width;
const ALTO = lienzo.height;
const TAM_TILE = 40;

// ===== VARIABLES DE JUEGO =====
let vidas = 3;
let juegoTerminado = false;
let mensaje = "";
let tiempoInvulnerable = 0;

// ===== MAPA =====
const TAM_MAPA = 35;
const mapa = Array.from({length:TAM_MAPA},(_,i)=>
  Array.from({length:TAM_MAPA},(_,j)=>
    (i===0||j===0||i===TAM_MAPA-1||j===TAM_MAPA-1||Math.random()<0.10)?1:0
  )
);

// ===== PROYECCIÓN ISO =====
function proyeccionIsometrica(i,j){
  return {
    x: (i - j) * TAM_TILE,
    y: (i + j) * (TAM_TILE/2)
  };
}

// ===== JUGADOR =====
class Jugador{
  constructor(){
    this.i=2;
    this.j=2;
  }

  mover(di,dj){
    if(juegoTerminado) return;

    let ni=this.i+di;
    let nj=this.j+dj;
    if(mapa[ni] && mapa[ni][nj]===0){
      this.i=ni;
      this.j=nj;
    }
  }

  reiniciar(){
    this.i=2;
    this.j=2;
  }

  dibujar(camX,camY){
    const p=proyeccionIsometrica(this.i,this.j);

    if(tiempoInvulnerable>0 && Math.floor(tiempoInvulnerable/5)%2===0){
      return;
    }

    contexto.fillStyle="deepskyblue";
    contexto.beginPath();
    contexto.arc(
      p.x - camX,
      p.y + TAM_TILE/2 - camY,
      12,0,Math.PI*2
    );
    contexto.fill();
  }
}

// ===== ENEMIGO =====
class Enemigo{
  constructor(i,j){
    this.i=i;
    this.j=j;
    this.temporizador=0;
    this.direccion=this.direccionAleatoria();
  }

  direccionAleatoria(){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    return dirs[Math.floor(Math.random()*4)];
  }

  mover(){
    if(juegoTerminado) return;

    this.temporizador++;
    if(this.temporizador<30) return;
    this.temporizador=0;

    let ni=this.i+this.direccion[0];
    let nj=this.j+this.direccion[1];

    if(mapa[ni] && mapa[ni][nj]===0){
      this.i=ni;
      this.j=nj;
    } else {
      this.direccion=this.direccionAleatoria();
    }
  }

  dibujar(camX,camY){
    const p=proyeccionIsometrica(this.i,this.j);
    contexto.fillStyle="crimson";
    contexto.beginPath();
    contexto.arc(
      p.x - camX,
      p.y + TAM_TILE/2 - camY,
      12,0,Math.PI*2
    );
    contexto.fill();
  }
}

// ===== COLISIONES =====
function comprobarColisiones(){

  // 🔒 NO comprobar si el juego terminó
  if(juegoTerminado) return;

  if(tiempoInvulnerable>0) return;

  enemigos.forEach(enemigo=>{
    if(enemigo.i===jugador.i && enemigo.j===jugador.j){

      vidas--;
      tiempoInvulnerable = 60;

      if(vidas<=0){
        vidas = 0; // seguridad extra
        mensaje="💀 GAME OVER";
        juegoTerminado=true;
      } else {
        mensaje="☠️ Has perdido una vida";
      }
    }
  });
}

// ===== MAPA =====
function dibujarMapa(camX,camY){
  for(let i=0;i<TAM_MAPA;i++){
    for(let j=0;j<TAM_MAPA;j++){
      const p=proyeccionIsometrica(i,j);

      contexto.beginPath();
      contexto.moveTo(p.x-camX, p.y-camY);
      contexto.lineTo(p.x+TAM_TILE-camX, p.y+TAM_TILE/2-camY);
      contexto.lineTo(p.x-camX, p.y+TAM_TILE-camY);
      contexto.lineTo(p.x-TAM_TILE-camX, p.y+TAM_TILE/2-camY);
      contexto.closePath();

      if(mapa[i][j]===1){
        contexto.fillStyle="#444";
        contexto.fill();
      }

      contexto.strokeStyle="#222";
      contexto.stroke();
    }
  }
}

// ===== HUD =====
function dibujarHUD(){
  contexto.fillStyle="black";
  contexto.fillRect(0,0,ANCHO,40);

  contexto.fillStyle="white";
  contexto.font="18px Arial";
  contexto.fillText("Vidas: "+vidas,20,25);

  if(juegoTerminado){
    contexto.fillStyle="rgba(0,0,0,0.7)";
    contexto.fillRect(ANCHO/2-200,ALTO/2-60,400,120);

    contexto.fillStyle="white";
    contexto.font="26px Arial";
    contexto.textAlign="center";
    contexto.fillText(mensaje,ANCHO/2,ALTO/2);
    contexto.font="16px Arial";
    contexto.fillText("Pulsa ENTER para reiniciar",ANCHO/2,ALTO/2+30);
    contexto.textAlign="left";
  }
}

// ===== INICIALIZACIÓN =====
const jugador=new Jugador();
const enemigos=[
  new Enemigo(10,10),
  new Enemigo(25,20),
  new Enemigo(15,30),
  new Enemigo(30,8)
];

// ===== CONTROLES =====
document.addEventListener("keydown",evento=>{
  if(juegoTerminado && evento.key==="Enter"){
    vidas=3;
    jugador.reiniciar();
    juegoTerminado=false;
    mensaje="";
    return;
  }

  if(evento.key==="w") jugador.mover(-1,0);
  if(evento.key==="s") jugador.mover(1,0);
  if(evento.key==="a") jugador.mover(0,1);
  if(evento.key==="d") jugador.mover(0,-1);
});

// ===== BUCLE =====
function bucleJuego(){

  if(tiempoInvulnerable>0){
    tiempoInvulnerable--;
  }

  const posJugador=proyeccionIsometrica(jugador.i,jugador.j);
  const camX=posJugador.x-ANCHO/2;
  const camY=posJugador.y-ALTO/2;

  contexto.clearRect(0,0,ANCHO,ALTO);

  dibujarMapa(camX,camY);

  enemigos.forEach(e=>{
    e.mover();
    e.dibujar(camX,camY);
  });

  jugador.dibujar(camX,camY);

  comprobarColisiones();
  dibujarHUD();

  requestAnimationFrame(bucleJuego);
}

bucleJuego();
</script>
</body>
</html>

<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Juego Isométrico v3.0</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0e0e0e;
        }

        canvas {
            display: block;
            background: #1a1a1a;
        }
    </style>
</head>

<body>
    <canvas id="lienzo"></canvas>

    <script>
        const lienzo = document.getElementById("lienzo");
        const ctx = lienzo.getContext("2d");

        function ajustarPantalla() {
            lienzo.width = window.innerWidth;
            lienzo.height = window.innerHeight;
        }
        window.addEventListener("resize", ajustarPantalla);
        ajustarPantalla();

        const TAM_TILE = 40;
        const TAM_MAPA = 35;

        let vidas = 3;
        let nivel = 1;
        let juegoTerminado = false;
        let juegoPausado = false;
        let mensaje = "";
        let tiempoInvulnerable = 0;

        let mapa;
        let monedas = [];
        let enemigos = [];

        // ===== MAPA =====
        function generarMapa() {
            mapa = Array.from({ length: TAM_MAPA }, (_, i) =>
                Array.from({ length: TAM_MAPA }, (_, j) =>
                    (i === 0 || j === 0 || i === TAM_MAPA - 1 || j === TAM_MAPA - 1 || Math.random() < 0.10) ? 1 : 0
                )
            );
        }

        function iso(i, j) {
            return {
                x: (i - j) * TAM_TILE,
                y: (i + j) * (TAM_TILE / 2)
            };
        }

        // ===== JUGADOR =====
        class Jugador {
            constructor() {
                this.i = 2;
                this.j = 2;
                this.monedasRecogidas = 0;
            }

            mover(di, dj) {
                if (juegoTerminado || juegoPausado) return;
                let ni = this.i + di, nj = this.j + dj;
                if (mapa[ni] && mapa[ni][nj] === 0) {
                    this.i = ni; this.j = nj;
                }
            }

            reiniciar() {
                this.i = 2;
                this.j = 2;
                this.monedasRecogidas = 0;
            }

            dibujar(camX, camY) {
                const p = iso(this.i, this.j);

                if (tiempoInvulnerable > 0 && Math.floor(tiempoInvulnerable / 5) % 2 === 0) return;

                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.ellipse(p.x - camX, p.y + TAM_TILE / 2 - camY + 10, 12, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#00bfff";
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y + TAM_TILE / 2 - camY, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ===== ENEMIGO =====
        class Enemigo {
            constructor(i, j) {
                this.i = i;
                this.j = j;
                this.timer = 0;
                this.dir = this.randomDir();
            }

            randomDir() {
                const d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                return d[Math.floor(Math.random() * 4)];
            }

            mover() {
                if (juegoTerminado || juegoPausado) return;

                this.timer++;
                if (this.timer < 25) return;
                this.timer = 0;

                let ni = this.i + this.dir[0];
                let nj = this.j + this.dir[1];

                if (mapa[ni] && mapa[ni][nj] === 0) {
                    this.i = ni; this.j = nj;
                } else {
                    this.dir = this.randomDir();
                }
            }

            dibujar(camX, camY) {
                const p = iso(this.i, this.j);

                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.ellipse(p.x - camX, p.y + TAM_TILE / 2 - camY + 10, 12, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ff3b3b";
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y + TAM_TILE / 2 - camY, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ===== MONEDA =====
        class Moneda {
            constructor(i, j) { this.i = i; this.j = j; }
            dibujar(camX, camY) {
                const p = iso(this.i, this.j);

                ctx.fillStyle = "gold";
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y + TAM_TILE / 2 - camY, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ===== GENERADORES =====
        function generarMonedas() {
            monedas = [];
            const total = 3 + nivel; // Nivel 1 = 4
            for (let i = 0; i < total; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * TAM_MAPA);
                    y = Math.floor(Math.random() * TAM_MAPA);
                } while (mapa[x][y] !== 0);
                monedas.push(new Moneda(x, y));
            }
        }

        function generarEnemigos() {
            enemigos = [];
            const total = 2 + nivel; // Nivel 1 = 3
            for (let i = 0; i < total; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * TAM_MAPA);
                    y = Math.floor(Math.random() * TAM_MAPA);
                } while (mapa[x][y] !== 0);
                enemigos.push(new Enemigo(x, y));
            }
        }

        // ===== COLISIONES =====
        function comprobarColisiones() {
            if (juegoTerminado || juegoPausado) return;

            monedas = monedas.filter(m => {
                if (m.i === jugador.i && m.j === jugador.j) {
                    jugador.monedasRecogidas++;
                    return false;
                }
                return true;
            });

            if (monedas.length === 0) {
                mensaje = "🎉 NIVEL SUPERADO";
                juegoTerminado = true;
                nivel++;
            }

            if (tiempoInvulnerable > 0) return;

            enemigos.forEach(e => {
                if (e.i === jugador.i && e.j === jugador.j) {
                    vidas--;
                    tiempoInvulnerable = 60;
                    if (vidas <= 0) {
                        vidas = 0;
                        mensaje = "💀 GAME OVER";
                        juegoTerminado = true;
                    }
                }
            });
        }

        // ===== HUD =====
        function dibujarHUD() {

            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, lienzo.width, 60);

            ctx.fillStyle = "#00ffcc";
            ctx.font = "18px Arial";
            ctx.fillText("Nivel: " + nivel, 20, 35);

            ctx.fillStyle = "#ff6666";
            ctx.fillText("Vidas: " + vidas, 140, 35);

            ctx.fillStyle = "#ffd700";
            ctx.fillText("Monedas: " + jugador.monedasRecogidas, 260, 35);

            if (juegoTerminado) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, lienzo.width, lienzo.height);

                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "40px Arial";
                ctx.fillText(mensaje, lienzo.width / 2, lienzo.height / 2);

                ctx.font = "20px Arial";
                ctx.fillText("Pulsa ENTER para continuar",
                    lienzo.width / 2,
                    lienzo.height / 2 + 50);

                ctx.textAlign = "left";
            }

            if (juegoPausado) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, lienzo.width, lienzo.height);

                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.font = "40px Arial";
                ctx.fillText("⏸ PAUSA",
                    lienzo.width / 2,
                    lienzo.height / 2);

                ctx.textAlign = "left";
            }
        }

        // ===== MAPA =====
        function dibujarMapa(camX, camY) {
            for (let i = 0; i < TAM_MAPA; i++) {
                for (let j = 0; j < TAM_MAPA; j++) {
                    const p = iso(i, j);

                    ctx.beginPath();
                    ctx.moveTo(p.x - camX, p.y - camY);
                    ctx.lineTo(p.x + TAM_TILE - camX, p.y + TAM_TILE / 2 - camY);
                    ctx.lineTo(p.x - camX, p.y + TAM_TILE - camY);
                    ctx.lineTo(p.x - TAM_TILE - camX, p.y + TAM_TILE / 2 - camY);
                    ctx.closePath();

                    ctx.fillStyle = mapa[i][j] === 1 ? "#2b2b2b" : "#1e3d2f";
                    ctx.fill();
                    ctx.strokeStyle = "#111";
                    ctx.stroke();
                }
            }
        }

        // ===== NIVEL =====
        function iniciarNivel() {
            generarMapa();
            generarMonedas();
            generarEnemigos();
            jugador.reiniciar();
            juegoTerminado = false;
            mensaje = "";
        }

        // ===== CONTROLES =====
        document.addEventListener("keydown", e => {

            if (e.key === "p" || e.key === "P") {
                juegoPausado = !juegoPausado;
            }

            if (juegoTerminado && e.key === "Enter") {
                if (vidas <= 0) {
                    vidas = 3;
                    nivel = 1;
                }
                iniciarNivel();
                return;
            }

            if (e.key === "w") jugador.mover(-1, 0);
            if (e.key === "s") jugador.mover(1, 0);
            if (e.key === "a") jugador.mover(0, 1);
            if (e.key === "d") jugador.mover(0, -1);
        });

        // ===== BUCLE =====
        function bucle() {

            if (tiempoInvulnerable > 0) tiempoInvulnerable--;

            const pos = iso(jugador.i, jugador.j);
            const camX = pos.x - lienzo.width / 2;
            const camY = pos.y - lienzo.height / 2;

            ctx.clearRect(0, 0, lienzo.width, lienzo.height);

            dibujarMapa(camX, camY);
            monedas.forEach(m => m.dibujar(camX, camY));
            enemigos.forEach(e => { e.mover(); e.dibujar(camX, camY); });
            jugador.dibujar(camX, camY);

            comprobarColisiones();
            dibujarHUD();

            requestAnimationFrame(bucle);
        }

        const jugador = new Jugador();
        iniciarNivel();
        bucle();
    </script>
</body>

</html>
